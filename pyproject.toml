# Formatting and lint settings for the Python checks (`ruff format .` and `ruff check .`).
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["private", "lean"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E741",  # single-letter names such as l and I follow the paper's notation
    "E501",  # remaining long lines are LaTeX/text strings; `ruff format` handles code
]
